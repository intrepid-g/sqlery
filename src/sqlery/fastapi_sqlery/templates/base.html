<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}django-sqlery{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js for interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <!-- Logo/Brand -->
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-blue-600">
                            django-sqlery
                        </a>
                    </div>

                    <!-- Main Navigation -->
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-4">
                        <a href="/"
                           class="{% if page == 'dashboard' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/jobs"
                           class="{% if page == 'jobs' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Jobs
                        </a>
                        <a href="/scheduled-tasks"
                           class="{% if page == 'scheduled_tasks' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Scheduled Tasks
                        </a>
                        <a href="/workers"
                           class="{% if page == 'workers' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Workers
                        </a>
                        <a href="/registries"
                           class="{% if page == 'registries' %}border-blue-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Registries
                        </a>
                    </div>
                </div>

                <!-- Right side (could add user menu, settings, etc.) -->
                <div class="flex items-center">
                    <span class="text-sm text-gray-500">Standalone Mode</span>
                </div>
            </div>
        </div>

        <!-- Mobile menu (optional) -->
        <div class="sm:hidden" x-data="{ open: false }">
            <button @click="open = !open" class="w-full flex justify-between items-center px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                <span>Menu</span>
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </button>

            <div x-show="open" x-cloak class="pb-3 space-y-1">
                <a href="/" class="block pl-3 pr-4 py-2 border-l-4 {% if page == 'dashboard' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50{% endif %} text-base font-medium">
                    Dashboard
                </a>
                <a href="/jobs" class="block pl-3 pr-4 py-2 border-l-4 {% if page == 'jobs' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50{% endif %} text-base font-medium">
                    Jobs
                </a>
                <a href="/scheduled-tasks" class="block pl-3 pr-4 py-2 border-l-4 {% if page == 'scheduled_tasks' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50{% endif %} text-base font-medium">
                    Scheduled Tasks
                </a>
                <a href="/workers" class="block pl-3 pr-4 py-2 border-l-4 {% if page == 'workers' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50{% endif %} text-base font-medium">
                    Workers
                </a>
                <a href="/registries" class="block pl-3 pr-4 py-2 border-l-4 {% if page == 'registries' %}border-blue-500 text-blue-700 bg-blue-50{% else %}border-transparent text-gray-600 hover:bg-gray-50{% endif %} text-base font-medium">
                    Registries
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-12 border-t border-gray-200 bg-white">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">
                django-sqlery - PostgreSQL-based background job queue
            </p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
