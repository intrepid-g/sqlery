name: Tests

# CI matrix (plan 03-07, TEST-11):
#   - Default rails (unit/chaos/coverage on the `test` job, plus the
#     `standalone-no-django` job): run all tests EXCEPT `-m postgres`.
#   - Postgres rail (the "Run @pytest.mark.postgres suite" step):
#     runs ONLY `-m postgres` against the postgres:15 service container.
#   - Together these cover the full mode × backend grid.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # python-version: ['3.11', '3.12', '3.13']
        python-version: ['3.13']
        django-version: ['5.2']  # LTS floor (ASYN-02) per 02-01-PLAN.

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sqlery_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"
        uv pip install "django==${{ matrix.django-version }}.*"

    - name: Run unit tests
      env:
        PYTHONPATH: .
      run: |
        uv run pytest tests/ -v --ignore=tests/chaos/ -x -m "not postgres"

    - name: Run chaos/property tests
      env:
        PYTHONPATH: .
      run: |
        uv run pytest tests/chaos/ -v --timeout=60 -m "not postgres" || echo "Chaos tests completed (some may be skipped)"

    - name: Run tests with PostgreSQL
      env:
        PYTHONPATH: .
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sqlery_test
      run: |
        uv run pytest tests/test_atomic_claiming.py tests/test_atomic_scheduler.py -v --timeout=30 || echo "PostgreSQL-specific tests completed"

    - name: Run @pytest.mark.postgres suite
      env:
        PYTHONPATH: .
        SQLERY_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sqlery_test
      # Plan 03-07: the exit-code-5 tolerance is removed. PG rail must
      # collect > 0 tests; an empty collection now fails the job.
      # Phase 11 (PARITY-05): this step has no path filter, so -m postgres
      # also collects the new parity cells under the DJANGO backend —
      # tests/test_parity_scheduler.py (Django x Postgres failover/E2E) plus
      # the PG cells in tests/test_atomic_scheduler.py and
      # tests/test_core_standalone.py. It therefore enforces the
      # Django x Postgres parity cells of the matrix.
      # Issue #23: this step previously had NO --timeout, unlike every other
      # pytest invocation in this workflow (see the chaos/atomic-claiming
      # steps above). A hanging cell (e.g. a daemon E2E cell that forks a
      # real detached worker subprocess) would run until GitHub's own job
      # cancellation force-kills the whole process tree — bypassing the
      # in-process finally-block cleanup that reaps tracked child processes
      # (worker_pool.py/daemon.py) — which is what surfaced as "operation was
      # canceled" plus orphaned uv/pytest/python3 processes. A pytest-level
      # timeout raises a catchable exception inside the hanging test instead,
      # so that cleanup runs and the failure reports cleanly.
      run: uv run pytest -m postgres -v --tb=short --timeout=90

    # Phase 11 (PARITY-05): the standalone x Postgres parity cells are NOT
    # exercised by the step above (pytest-django resolves the Django backend)
    # nor by the standalone-no-django job (import-only, never runs pytest).
    # SQLERY_FORCE_STANDALONE=1 forces compat to resolve the standalone
    # backend even though Django is installed in [dev], matching the
    # tests/integration/conftest.py::_run_no_django convention. This closes
    # the silently-skipped standalone x Postgres cell. No `|| echo` escape —
    # a failing cell fails the build (first-class gate). A --collect-only
    # pre-check rejects an empty collection (exit 5) so a missing/skipped
    # standalone PG cell fails the job too.
    #
    # CR-01 (11-REVIEW): the previous selection ran the WHOLE of three files
    # under -m postgres with SQLERY_FORCE_STANDALONE=1. Two of those files
    # contain DJANGO-mode PG cells (test_parity_scheduler.py::TestParityFailover,
    # test_atomic_scheduler.py::TestCronSemanticsHardeningPostgres) that resolve
    # get_backend() -> SQLAlchemyBackend WITHOUT ever calling initialize(), so
    # they raise RuntimeError("Database not initialized") on the live PG rail and
    # ERROR the build for the wrong reason. The Django x Postgres cells are
    # already covered by the unforced "Run @pytest.mark.postgres suite" step
    # above. We now scope this step to the GENUINELY-standalone PG cells via the
    # dedicated `standalone_pg` marker (registered in pyproject.toml), so
    # `-m "postgres and standalone_pg"` collects ONLY the standalone-backend
    # cells. The --collect-only precheck (WR-03) therefore guarantees the
    # standalone cells specifically are collected: an empty/exit-5 collection
    # now means a real missing standalone cell, not just any postgres cell.
    - name: Run standalone-mode parity suite with PostgreSQL
      env:
        PYTHONPATH: .
        SQLERY_FORCE_STANDALONE: "1"
        SQLERY_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sqlery_test
      run: |
        # Old (CR-01: also selected Django-ORM PG cells that resolve an
        # uninitialized SQLAlchemy backend and ERROR; the --co precheck could
        # pass on those Django cells alone, masking a missing standalone cell):
        # uv run pytest -m postgres --co -q \
        #   tests/test_parity_scheduler.py \
        #   tests/test_core_standalone.py \
        #   tests/test_atomic_scheduler.py
        # uv run pytest -m postgres -v --tb=short \
        #   tests/test_parity_scheduler.py \
        #   tests/test_core_standalone.py \
        #   tests/test_atomic_scheduler.py
        # New: scope to the standalone-backend PG cells only (WR-03 precheck now
        # asserts the standalone cells specifically are collected).
        uv run pytest -m "postgres and standalone_pg" --co -q \
          tests/test_parity_scheduler.py \
          tests/test_core_standalone.py \
          tests/chaos/test_lease_zombie.py
        # Issue #23: add --timeout so a hang here fails cleanly through pytest's
        # own catchable timeout instead of the job needing external cancellation
        # (see the matching comment on the "Run @pytest.mark.postgres suite" step).
        uv run pytest -m "postgres and standalone_pg" -v --tb=short --timeout=90 \
          tests/test_parity_scheduler.py \
          tests/test_core_standalone.py \
          tests/chaos/test_lease_zombie.py

    - name: Run tests with coverage
      env:
        PYTHONPATH: .
      run: |
        uv run pytest tests/ -m "not postgres" \
          --ignore=tests/chaos/ \
          --cov=src/sqlery \
          --cov-report=term-missing \
          --cov-report=html \
          --cov-fail-under=13

    - name: Upload coverage HTML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-py${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 14

  standalone-no-django:
    # Regression guard for UNIF-04/05/06: verifies `sqlery.core` and all its
    # submodules import in a fresh venv where `django` is NOT installed.
    # See .planning/phases/01-core-unification/01-CONTEXT.md.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    # - name: Set up Python 3.10
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        # python-version: '3.10'
        python-version: '3.13'

    - name: Install package WITHOUT django (standalone extra only)
      run: |
        uv venv
        # Use the [standalone] extra explicitly; do NOT use `uv sync` which
        # would resolve the dev/all-deps environment and pull django in.
        uv pip install ".[standalone]"

    - name: Assert django is NOT installed (T-01-04 mitigation)
      run: |
        # If django is importable, the env is contaminated and the
        # following import success would be a false positive. Fail loudly.
        if uv run python -c "import django" 2>/dev/null; then
          echo "FAIL: django is installed in the standalone venv (T-01-04)"
          uv pip list | grep -i django || true
          exit 1
        else
          echo "django absent OK"
        fi

    - name: Import all sqlery.core submodules without django
      run: |
        uv run python -c "
        import sqlery.core
        import sqlery.core.claiming
        import sqlery.core.worker
        import sqlery.core.daemon
        import sqlery.core.db_resilience
        import sqlery.core.log_config
        import sqlery.core.model_utils
        import sqlery.core.daemon_runner
        import sqlery.core.worker_runner
        import sqlery.core.scheduler_tasks
        import sqlery.core.utils
        import sqlery.core.worker_pool
        print('all-core-imports-ok')
        "
